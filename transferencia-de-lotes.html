function downloadRetem(name, content, type) {
  const url=URL.createObjectURL(new Blob([content],{type}));
  const link=document.createElement('a');
  link.href=url;
  link.download=name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  <style>
.retem-file-input { position:absolute; width:1px; height:1px; clip-path:inset(50%); }
.retem-drop { display:flex; align-items:center; gap:12px; width:100%; border:2px dashed var(--ink-border); padding:12px; text-align:left; border-radius:4px; }
.retem-drop:hover,.retem-drop.retem-dragging { border-color:var(--primary); background:var(--sidebar-accent); }
.retem-drop-icon { display:grid; place-items:center; width:36px; height:36px; flex:none; background:var(--primary); color:var(--primary-foreground); font-weight:800; border-radius:4px; }
.retem-search { display:flex; align-items:center; border:1px solid var(--ink-border); background:var(--sidebar-accent); border-radius:4px; }
.retem-search input { width:100%; min-width:0; padding:9px; font-size:13px; }
.retem-search input::-webkit-search-cancel-button { display:none; }
.retem-search button { padding:3px 10px; }
.retem-queue { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; border:1px solid var(--ink-border); background:var(--ink-border); }
.retem-queue button { display:grid; padding:6px 2px; font-size:11px; font-weight:600; background:var(--ink); }
.retem-queue button[aria-pressed="true"] { background:var(--primary); color:var(--primary-foreground); }
.retem-queue span { font-family:var(--font-mono); }
.retem-secondary { border:1px solid var(--ink-border); border-radius:4px; padding:0 16px; min-height:44px; font-size:14px; }
.retem-secondary:hover { border-color:var(--primary); }
.retem-secondary:disabled { opacity:.4; }
.retem-save { border-color:var(--border); }
.retem-scan-feedback { display:flex; flex-direction:column; align-items:flex-start; gap:10px; min-width:0; max-width:100%; }
.retem-scan-summary { display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 10px; max-width:100%; color:#fff; }
.retem-scan-description { min-width:0; overflow-wrap:anywhere; font-weight:400; }
.retem-scan-line { display:flex; align-items:flex-start; gap:8px; min-width:0; max-width:100%; }
.retem-scan-icon { flex:none; margin-top:2px; }
.retem-scan-address { max-width:100%; }
.retem-scan-address strong { min-width:0; }
.retem-scan-address { display:inline-flex; align-items:center; flex-wrap:wrap; gap:6px 12px; padding:6px 12px; border-radius:4px; background:var(--primary); color:var(--primary-foreground); }
.retem-scan-address span { font-size:11px; text-transform:uppercase; }
.retem-scan-address strong { font-size:clamp(16px,2.4vw,24px); overflow-wrap:anywhere; }
.retem-expired { background:#b91c1c;color:white;border-radius:4px;padding:4px 8px;font-weight:700; }
.retem-expired-row { background:#fef2f2; }
.retem-validity { color:var(--ink-foreground); }
.retem-document-table { table-layout:fixed;min-width:650px; }
.retem-document-table :is(th,td) { text-align:left;padding:8px 16px; }
.retem-document-table :is(th,td):nth-child(n+3):nth-child(-n+5) { text-align:right;font-variant-numeric:tabular-nums; }
.retem-document-table th:first-child { width:34%; }
.retem-document-table th:nth-child(2),.retem-document-table th:last-child { width:15%; }
.retem-expired-label { display:inline-block; margin-top:4px; line-height:1.3; }
.retem-table-address { display:inline-block; padding:4px 8px; border-radius:4px; background:var(--primary); color:var(--primary-foreground); font-weight:700; }
@media (min-width:1024px) {
  .retem-sidebar { position:sticky; top:0; align-self:start; min-height:calc(100vh - 62px); max-height:100vh; overflow:auto; }
}
</style>
